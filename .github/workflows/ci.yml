name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  auditor-de-tarifas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q plugins/auditor-de-tarifas/tests

  ferramentas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q ferramentas/test_checar_sem_rede.py
      - run: python ferramentas/checar_sem_rede.py plugins/

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npx -y @anthropic-ai/claude-code@2.1.285 plugin validate --strict .
      - run: npx -y @anthropic-ai/claude-code@2.1.285 plugin validate --strict plugins/auditor-de-tarifas

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: baixar e conferir o gitleaks v8.30.1
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
      - run: ./gitleaks git . -v
      - run: ./gitleaks dir . -v
