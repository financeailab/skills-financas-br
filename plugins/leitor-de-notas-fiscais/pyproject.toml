[project]
name = "leitor-notas-fiscais"
version = "0.1.0"
description = "Leitor de NFS-e + NF-e para tesouraria (nucleo deterministico)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "defusedxml>=0.7.1", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
